    <script>
        const CLIENT_ID = '547073147985-ap3u2ed867imq6q810gjc82jfsme6tqm.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyBf3C_Ly8bIF_f-t30wE2e7cMsc2hz0co0';
        const SPREADSHEET_ID = '1Eob3yiujIi0sNtsPQr_HCvQtlybXnq6K11bm1wAcqAo';
        const SHEET_NAME = 'input';
        const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

        let tokenClient;
        let accessToken = null;

        function initGoogleAPI() {
            if (!window.location.protocol.startsWith('https')) {
                document.getElementById('error').innerText = 'Warning: Running on HTTP may cause authentication errors. Use HTTPS for best results.';
            }

            gapi.load('client', () => {
                gapi.client.init({
                    apiKey: API_KEY,
                    discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
                }).then(() => {
                    tokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: CLIENT_ID,
                        scope: SCOPES,
                        callback: (tokenResponse) => {
                            if (tokenResponse.error) {
                                document.getElementById('error').innerText = 'Authentication failed: ' + tokenResponse.error;
                                return;
                            }
                            accessToken = tokenResponse.access_token;
                            document.getElementById('loading').innerText = 'Authenticated successfully!';
                            setTimeout(() => { document.getElementById('loading').innerText = ''; }, 2000);
                        },
                    });
                    tokenClient.requestAccessToken();
                }).catch((error) => {
                    document.getElementById('error').innerText = 'Error initializing Google API: ' + error.message;
                });
            });
        }

        function calculateDutyHours(signOnTime) {
            if (!signOnTime) {
                console.warn('Sign On Time is empty or undefined');
                return 'N/A';
            }
            try {
                const [datePart, timePart] = signOnTime.split(' ');
                if (!datePart || !timePart) {
                    console.warn(`Invalid Sign On Time format: ${signOnTime}`);
                    return 'N/A';
                }
                const [day, month, year] = datePart.split('/').map(Number);
                const [hours, minutes, seconds] = timePart.split(':').map(Number);
                if (isNaN(day) || isNaN(month) || isNaN(year) || isNaN(hours) || isNaN(minutes) || isNaN(seconds)) {
                    console.warn(`Invalid date/time components in: ${signOnTime}`);
                    return 'N/A';
                }
                const signOnDateTime = new Date(year, month - 1, day, hours, minutes, seconds);
                if (isNaN(signOnDateTime.getTime())) {
                    console.warn(`Invalid Date object created from: ${signOnTime}`);
                    return 'N/A';
                }
                const now = new Date();
                const diffMs = now - signOnDateTime;
                const diffHours = diffMs / (1000 * 60 * 60);
                console.log(`Calculating duty hours: Sign On=${signOnTime}, Now=${now.toISOString()}, Hours=${diffHours.toFixed(2)}`);
                return diffHours >= 0 ? diffHours.toFixed(2) : 'N/A';
            } catch (error) {
                console.warn(`Error calculating duty hours: ${error.message}, Sign On=${signOnTime}`);
                return 'N/A';
            }
        }

        function showReport() {
            const criteria = document.getElementById('criteria').value;
            const lobby = document.getElementById('lobby').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            if (!fromDate || !toDate) {
                document.getElementById('error').innerText = 'Please select both From Date and To Date.';
                return;
            }

            if (!tokenClient) {
                document.getElementById('error').innerText = 'Google API not initialized. Please wait and try again.';
                setTimeout(showReport, 2000);
                return;
            }

            if (!accessToken) {
                document.getElementById('error').innerText = 'Not authenticated. Requesting access...';
                tokenClient.requestAccessToken();
                setTimeout(showReport, 3000);
                return;
            }

            document.getElementById('loading').innerText = 'Fetching data...';
            gapi.client.sheets.spreadsheets.values.get({
                spreadsheetId: SPREADSHEET_ID,
                range: `${SHEET_NAME}!A:X`,
            }).then((response) => {
                document.getElementById('loading').innerText = '';
                const values = response.result.values || [];
                const thead = document.getElementById('tableHeader');
                const tbody = document.getElementById('reportBody');
                thead.innerHTML = '';
                tbody.innerHTML = '';
                document.getElementById('error').innerText = '';

                // Set table headers based on criteria
                let headerRow = document.createElement('tr');
                if (criteria === 'OUR JURISDICTION') {
                    headerRow.innerHTML = `
                        <th class="our-jurisdiction">LP ID</th>
                        <th class="our-jurisdiction">LP Name</th>
                        <th class="our-jurisdiction">LP Mobile</th>
                        <th class="our-jurisdiction">ALP Name</th>
                        <th class="our-jurisdiction">Sign On Time</th>
                        <th class="our-jurisdiction">Train No</th>
                        <th class="our-jurisdiction">LOCO No</th>
                        <th class="our-jurisdiction">TimeStamp</th>
                        <th class="our-jurisdiction">TLC Timestamp</th>
                        <th class="our-jurisdiction">Current Location</th>
                        <th class="our-jurisdiction">Total Duty Hours</th>
                        <th class="our-jurisdiction">CCC Remark</th>
                        <th class="our-jurisdiction">Sign Off Time</th>
                        <th class="our-jurisdiction">Sign Off Station</th>
                        <th class="our-jurisdiction">Action</th>
                    `;
                } else {
                    headerRow.innerHTML = `
                        <th class="our-crew">LP ID</th>
                        <th class="our-crew">LP Name</th>
                        <th class="our-crew">LP Mobile</th>
                        <th class="our-crew">ALP Name</th>
                        <th class="our-crew">Sign On Time</th>
                        <th class="our-crew">Train No</th>
                        <th class="our-crew">LOCO No</th>
                        <th class="our-crew">TimeStamp</th>
                        <th class="our-crew">TLC Timestamp</th>
                        <th class="our-crew">Current Location</th>
                        <th class="our-crew">Assign Lobby</th>
                        <th class="our-crew">Total Duty Hours</th>
                        <th class="our-crew">CCC Remark</th>
                        <th class="our-crew">Sign Off Time</th>
                        <th class="our-crew">Sign Off Station</th>
                        <th class="our-crew">Action</th>
                    `;
                }
                thead.appendChild(headerRow);

                // Filter data
                const filteredData = values.filter((row, index) => {
                    if (index === 0) return false; // Skip header row
                    // Check Sign Off Time (W) is blank for both criteria
                    const signOffTime = row[22] || '';
                    if (signOffTime) return false;
                    // Date filter (G)
                    const rowDate = row[6] ? (row[6].includes('/') ? row[6].split('/').reverse().join('-') : row[6]) : '';
                    const dateMatch = (!fromDate || rowDate >= fromDate) && (!toDate || rowDate <= toDate);
                    // Criteria filter
                    let criteriaMatch = false;
                    if (criteria === 'OUR CREW') {
                        const lpId = row[0] || '';
                        const lpIdPrefix = lpId.match(/^[A-Z]+/)?.[0] || '';
                        criteriaMatch = lpIdPrefix === lobby;
                    } else if (criteria === 'OUR JURISDICTION') {
                        const assignLobby = row[18] || '';
                        criteriaMatch = assignLobby === lobby;
                    }
                    return dateMatch && criteriaMatch;
                });

                if (filteredData.length === 0) {
                    document.getElementById('error').innerText = 'No data found for the selected criteria, lobby, and date range.';
                }

                filteredData.forEach((row, index) => {
                    const rowIndex = values.indexOf(row) + 1; // 1-based index
                    const tr = document.createElement('tr');
                    tr.id = `row_${index}`;
                    tr.className = 'tooltip';
                    tr.setAttribute('data-tooltip', row[19] || 'No TLC Remark');
                    const dutyHours = calculateDutyHours(row[7]);
                    if (row[21]) {
                        tr.classList.add('has-ccc-remark');
                    }
                    if (criteria === 'OUR JURISDICTION') {
                        tr.innerHTML = `
                            <td class="our-jurisdiction">${row[0] || ''}</td> <!-- LP ID -->
                            <td class="our-jurisdiction">${row[1] || ''}</td> <!-- LP Name -->
                            <td class="our-jurisdiction">${row[2] || ''}</td> <!-- LP Mobile -->
                            <td class="our-jurisdiction">${row[4] || ''}</td> <!-- ALP Name -->
                            <td class="our-jurisdiction">${row[7] || ''}</td> <!-- Sign On Time -->
                            <td class="our-jurisdiction">${row[9] || ''}</td> <!-- Train No -->
                            <td class="our-jurisdiction">${row[10] || ''}</td> <!-- LOCO No -->
                            <td class="our-jurisdiction">${row[13] || ''}</td> <!-- TimeStamp -->
                            <td class="our-jurisdiction">${row[16] || ''}</td> <!-- TLC Timestamp -->
                            <td class="our-jurisdiction">${row[17] || ''}</td> <!-- Current Location -->
                            <td class="our-jurisdiction">${dutyHours}</td> <!-- Total Duty Hours -->
                            <td class="our-jurisdiction"><textarea id="cccRemark_${index}" placeholder="Enter CCC Remark" oninput="validateRow(${index}, '${criteria}')">${row[21] || ''}</textarea></td>
                            <td class="our-jurisdiction"><input type="datetime-local" id="signOffTime_${index}" oninput="validateRow(${index}, '${criteria}')"></td>
                            <td class="our-jurisdiction"><input type="text" id="signOffStation_${index}" placeholder="Enter Station" oninput="this.value = this.value.toUpperCase(); validateRow(${index}, '${criteria}')"></td>
                            <td class="our-jurisdiction"><button id="submitButton_${index}" onclick="submitData(${rowIndex}, ${index}, '${criteria}')" disabled>Submit</button></td>
                        `;
                    } else {
                        tr.innerHTML = `
                            <td class="our-crew">${row[0] || ''}</td> <!-- LP ID -->
                            <td class="our-crew">${row[1] || ''}</td> <!-- LP Name -->
                            <td class="our-crew">${row[2] || ''}</td> <!-- LP Mobile -->
                            <td class="our-crew">${row[4] || ''}</td> <!-- ALP Name -->
                            <td class="our-crew">${row[7] || ''}</td> <!-- Sign On Time -->
                            <td class="our-crew">${row[9] || ''}</td> <!-- Train No -->
                            <td class="our-crew">${row[10] || ''}</td> <!-- LOCO No -->
                            <td class="our-crew">${row[13] || ''}</td> <!-- TimeStamp -->
                            <td class="our-crew">${row[16] || ''}</td> <!-- TLC Timestamp -->
                            <td class="our-crew">${row[17] || ''}</td> <!-- Current Location -->
                            <td class="our-crew">${row[18] || ''}</td> <!-- Assign Lobby -->
                            <td class="our-crew">${dutyHours}</td> <!-- Total Duty Hours -->
                            <td class="our-crew"><textarea id="cccRemark_${index}" placeholder="Enter CCC Remark" oninput="validateRow(${index}, '${criteria}')">${row[21] || ''}</textarea></td>
                            <td class="our-crew"><input type="datetime-local" id="signOffTime_${index}" oninput="validateRow(${index}, '${criteria}')"></td>
                            <td class="our-crew"><input type="text" id="signOffStation_${index}" placeholder="Enter Station" oninput="this.value = this.value.toUpperCase(); validateRow(${index}, '${criteria}')"></td>
                            <td class="our-crew"><button id="submitButton_${index}" onclick="submitData(${rowIndex}, ${index}, '${criteria}')" disabled>Submit</button></td>
                        `;
                    }
                    tbody.appendChild(tr);
                    validateRow(index, criteria);
                });
            }).catch((error) => {
                document.getElementById('loading').innerText = '';
                document.getElementById('error').innerText = `Error fetching data: ${error.result?.error?.message || error.message}`;
                if (error.status === 400) {
                    document.getElementById('error').innerText += ' (Check if the sheet name "input" exists and has data in range A:X)';
                } else if (error.status === 401 || error.status === 403) {
                    document.getElementById('error').innerText += ' (Invalid or expired token. Re-authenticating...)';
                    tokenClient.requestAccessToken();
                    setTimeout(showReport, 3000);
                }
            });
        }

        function validateRow(index, criteria) {
            const cccRemark = document.getElementById(`cccRemark_${index}`).value.trim();
            const signOffTime = document.getElementById(`signOffTime_${index}`).value;
            const signOffStation = document.getElementById(`signOffStation_${index}`).value.trim().toUpperCase();
            const submitButton = document.getElementById(`submitButton_${index}`);

            if (criteria === 'OUR JURISDICTION') {
                // Enable submit if CCC Remark is filled
                submitButton.disabled = !cccRemark;
            } else {
                // OUR CREW: All fields required
                submitButton.disabled = !(cccRemark && signOffTime && signOffStation);
            }
        }

        function submitData(rowIndex, index, criteria) {
            if (!tokenClient) {
                document.getElementById('error').innerText = 'Google API not initialized. Please wait and try again.';
                setTimeout(() => submitData(rowIndex, index, criteria), 2000);
                return;
            }

            if (!accessToken) {
                document.getElementById('error').innerText = 'Not authenticated. Requesting access...';
                tokenClient.requestAccessToken();
                setTimeout(() => submitData(rowIndex, index, criteria), 3000);
                return;
            }

            const cccRemark = document.getElementById(`cccRemark_${index}`).value.trim();
            let signOffTimeInput = document.getElementById(`signOffTime_${index}`).value;
            let signOffStation = document.getElementById(`signOffStation_${index}`).value.trim().toUpperCase();
            let signOffTime = '';

            // Validate inputs
            if (!cccRemark) {
                document.getElementById('error').innerText = 'Please fill CCC Remark.';
                return;
            }

            if (signOffTimeInput) {
                const date = new Date(signOffTimeInput);
                if (isNaN(date.getTime())) {
                    document.getElementById('error').innerText = 'Invalid Sign Off Time format. Please use a valid date and time.';
                    return;
                }
                const day = date.getDate().toString().padStart(2, '0');
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const year = date.getFullYear();
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                const seconds = date.getSeconds().toString().padStart(2, '0');
                signOffTime = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
            }

            // Generate CCC Timestamp in IST (current time)
            try {
                const now = new Date();
                const istOptions = { timeZone: 'Asia/Kolkata' };
                const day = now.getDate().toString().padStart(2, '0');
                const month = (now.getMonth() + 1).toString().padStart(2, '0');
                const year = now.getFullYear();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                const cccTimestamp = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;

                document.getElementById('loading').innerText = 'Updating data...';
                const values = [[cccTimestamp, cccRemark, signOffTime, signOffStation]];
                const range = `${SHEET_NAME}!U${rowIndex}:X${rowIndex}`;
                gapi.client.sheets.spreadsheets.values.update({
                    spreadsheetId: SPREADSHEET_ID,
                    range: range,
                    valueInputOption: 'RAW',
                    resource: { values }
                }).then(() => {
                    document.getElementById('loading').innerText = '';
                    alert('Data updated successfully!');
                    const row = document.getElementById(`row_${index}`);
                    if (criteria === 'OUR JURISDICTION' && (!signOffTime || !signOffStation)) {
                        // Partial submit: Mark row light orange
                        row.classList.add('partial-submit');
                    } else {
                        // Full submit: Remove row
                        if (row) {
                            row.remove();
                        }
                    }
                }).catch((error) => {
                    document.getElementById('loading').innerText = '';
                    document.getElementById('error').innerText = `Error updating data: ${error.result?.error?.message || error.message}`;
                    if (error.status === 401 || error.status === 403) {
                        document.getElementById('error').innerText += ' (Invalid or expired token. Re-authenticating...)';
                        tokenClient.requestAccessToken();
                        setTimeout(() => submitData(rowIndex, index, criteria), 3000);
                    }
                });
            } catch (error) {
                document.getElementById('loading').innerText = '';
                document.getElementById('error').innerText = `Error formatting timestamp: ${error.message}`;
            }
        }

        window.onload = initGoogleAPI;
    </script>
</body>
</html>
